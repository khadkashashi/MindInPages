[project]
name = "mindinpages"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shashi khadka", email = "shashikhadka84@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.1",
    "django-celery-beat>=2.1.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "python-decouple>=3.8",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[project.scripts]
mindinpages = "mindinpages:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false